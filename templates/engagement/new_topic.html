{% extends "base.html" %}
{% block title %}New thread — {{ event.name }}{% endblock %}
{% block content %}
<div class="hero"><h1>Start a thread</h1></div>
<form method="post" class="panel">
  {% csrf_token %}
  {% for field in form %}
    <div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
  {% endfor %}
  <button class="btn">Post thread</button>
</form>
{% endblock %}
